{% extends 'base.html' %}
{% block title %}Mi Perfil - StakeFolclor{% endblock %}
{% block content %}
<div class="container section-pad">
  <div class="row justify-content-center">
    <div class="col-md-6">
      <div class="sf-auth-card">
        <div class="text-center mb-4">
          <div style="width:80px;height:80px;border-radius:50%;background:var(--sf-surface2);border:2px solid var(--sf-border);display:flex;align-items:center;justify-content:center;margin:0 auto 1rem;">
            <i class="bi bi-person-fill" style="font-size:2rem;color:var(--sf-accent);"></i>
          </div>
          <h2 style="font-family:'Rajdhani',sans-serif;font-weight:700;">{{ user.username }}</h2>
          <p style="color:var(--sf-text-muted);font-size:0.875rem;">{{ user.email }}</p>
        </div>
        <div style="background:var(--sf-surface2);border-radius:8px;padding:1rem;">
          <p style="color:var(--sf-text-muted);font-size:0.8rem;text-transform:uppercase;letter-spacing:1px;margin-bottom:0.5rem;">Miembro desde</p>
          <p style="color:var(--sf-text);font-weight:500;">{{ user.created_at|date:"d F Y" }}</p>
        </div>
        <div class="mt-3 d-flex gap-2">
          <a href="{% url 'predictions:my_predictions' %}" class="btn-sf flex-grow-1 justify-content-center">
            <i class="bi bi-graph-up"></i>Mis Predicciones
          </a>
          <a href="{% url 'accounts:logout' %}" class="btn-sf-outline">
            <i class="bi bi-box-arrow-right"></i>
          </a>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
